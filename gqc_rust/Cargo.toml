[package]
name = "gqc_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
reqwest = { version = "0.11", features = ["stream", "rustls-tls"], default-features = false }
scraper = "0.18"
futures = "0.3"
url = "2.5"